name: Import TurkishCineStream v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tcs-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-697c-8210-a999-21ddf214e501/raw?se=2026-09-26T00%3A28%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=538d3e0e-d572-546e-ab15-45868761bc8a&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A35%3A31Z&ske=2026-09-26T19%3A35%3A31Z&sks=b&skv=2026-02-06&sig=wDEkZd8CgcP0yrX9v5YhSU8uXlBB4lmd9o4YSU%2BWx2E%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import TurkishCineStream v5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tcs" "$RUNNER_TEMP/test-builds"
          mkdir -p "$RUNNER_TEMP/tcs"
          curl -fsSL "$ARTIFACT_URL" -o "$RUNNER_TEMP/tcs/artifact.zip"
          unzip -q -j "$RUNNER_TEMP/tcs/artifact.zip" TurkishCineStream.cs3 -d "$RUNNER_TEMP/tcs"

          python - "$RUNNER_TEMP/tcs/TurkishCineStream.cs3" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          p=Path(sys.argv[1]); data=p.read_bytes()
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read("manifest.json"))
          assert m["name"]=="TurkishCineStream" and m["version"]==5, m
          assert len(data)==388553, len(data)
          assert hashlib.sha256(data).hexdigest()=="50fe8bcbf30c6756f751b94c03f5a869d99e2b751e441541f8786e085c3e40dd"
          PY

          update_catalog () {
            root="$1"
            branch="$2"
            cp "$RUNNER_TEMP/tcs/TurkishCineStream.cs3" "$root/TurkishCineStream.cs3"

            python - "$root" "$branch" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1]); branch=sys.argv[2]
          p=root/"TurkishCineStream.cs3"; data=p.read_bytes()
          digest=hashlib.sha256(data).hexdigest()

          pp=root/"plugins.json"
          rows=json.loads(pp.read_text(encoding="utf-8"))
          row={
            "url":f"https://raw.githubusercontent.com/Wiojelt/test/{branch}/TurkishCineStream.cs3",
            "status":1,
            "version":5,
            "name":"TurkishCineStream",
            "internalName":"TurkishCineStream",
            "authors":["Wiojelt","megix"],
            "description":"CineStream video motoru + Türkçe çoklu altyazı motoru + upstream CineStream ayar paneli (deneysel test sürümü)",
            "fileSize":len(data),
            "repositoryUrl":"https://github.com/Wiojelt/test",
            "language":"tr",
            "tvTypes":["Movie","TvSeries","Anime","AsianDrama"],
            "iconUrl":"https://raw.githubusercontent.com/Wiojelt/test/main/assets/turkishcinestream.png",
            "apiVersion":1,
            "fileHash":"sha256-"+digest
          }
          rows=[x for x in rows if x.get("internalName")!="TurkishCineStream"]
          rows.insert(0,row)
          pp.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          rp=root/"repo.json"
          repo=json.loads(rp.read_text(encoding="utf-8"))
          repo["pluginLists"]=[f"https://raw.githubusercontent.com/Wiojelt/test/{branch}/plugins.json?v=tcs-5-{digest[:12]}"]
          rp.write_text(json.dumps(repo,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          }

          update_catalog "$GITHUB_WORKSPACE" main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TurkishCineStream.cs3 plugins.json repo.json assets/turkishcinestream.png
          git -c commit.gpgsign=false commit --allow-empty-message -m ""
          git push origin HEAD:main

          git fetch origin builds
          git worktree add "$RUNNER_TEMP/test-builds" origin/builds
          update_catalog "$RUNNER_TEMP/test-builds" builds
          mkdir -p "$RUNNER_TEMP/test-builds/assets"
          cp "$GITHUB_WORKSPACE/assets/turkishcinestream.png" "$RUNNER_TEMP/test-builds/assets/turkishcinestream.png"
          git -C "$RUNNER_TEMP/test-builds" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/test-builds" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/test-builds" add TurkishCineStream.cs3 plugins.json repo.json assets/turkishcinestream.png
          git -C "$RUNNER_TEMP/test-builds" -c commit.gpgsign=false commit --allow-empty-message -m ""
          git -C "$RUNNER_TEMP/test-builds" push origin HEAD:builds
