name: Import TurkishCineStream v6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tcs-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3588-8210-a498-a7e62b2479ec/raw?se=2026-09-26T13%3A33%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=22a53235-1fa8-52af-a7c2-9760b93a99d9&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T07%3A40%3A51Z&ske=2026-09-27T07%3A40%3A51Z&sks=b&skv=2026-02-06&sig=u4d8KAyX6z6oyvj0wDJhyEznJQQJlLfUq28VSbxSTS8%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import TurkishCineStream v6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tcs" "$RUNNER_TEMP/test-builds"
          mkdir -p "$RUNNER_TEMP/tcs"
          curl -fsSL "$ARTIFACT_URL" -o "$RUNNER_TEMP/tcs/artifact.zip"
          unzip -q -j "$RUNNER_TEMP/tcs/artifact.zip" TurkishCineStream.cs3 -d "$RUNNER_TEMP/tcs"

          python - "$RUNNER_TEMP/tcs/TurkishCineStream.cs3" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          p=Path(sys.argv[1]); data=p.read_bytes()
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read("manifest.json"))
          assert m["name"]=="TurkishCineStream" and m["version"]==6, m
          assert len(data)==391581, len(data)
          assert hashlib.sha256(data).hexdigest()=="e6f3262d9a448365068ce7c4a67baafb147bfbb06f0f8e637aeeb77d13113b53"
          PY

          update_catalog () {
            root="$1"
            branch="$2"
            cp "$RUNNER_TEMP/tcs/TurkishCineStream.cs3" "$root/TurkishCineStream.cs3"

            python - "$root" "$branch" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1]); branch=sys.argv[2]
          p=root/"TurkishCineStream.cs3"; data=p.read_bytes()
          digest=hashlib.sha256(data).hexdigest()

          pp=root/"plugins.json"
          rows=json.loads(pp.read_text(encoding="utf-8"))
          existing=next((x for x in rows if x.get("internalName")=="TurkishCineStream"),{})
          row={
            "url":f"https://raw.githubusercontent.com/Wiojelt/test/{branch}/TurkishCineStream.cs3",
            "status":1,
            "version":6,
            "name":"TurkishCineStream",
            "internalName":"TurkishCineStream",
            "authors":["Wiojelt","megix"],
            "description":"CineStream video motoru + Türkçe çoklu altyazı motoru + upstream CineStream ayar paneli (deneysel test sürümü)",
            "fileSize":len(data),
            "repositoryUrl":"https://github.com/Wiojelt/test",
            "language":"tr",
            "tvTypes":["Movie","TvSeries","Anime","AsianDrama"],
            "iconUrl":existing.get("iconUrl","https://raw.githubusercontent.com/Wiojelt/test/main/assets/turkishcinestream.png"),
            "apiVersion":1,
            "fileHash":"sha256-"+digest
          }
          rows=[x for x in rows if x.get("internalName")!="TurkishCineStream"]
          rows.insert(0,row)
          pp.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          rp=root/"repo.json"
          repo=json.loads(rp.read_text(encoding="utf-8"))
          repo["pluginLists"]=[f"https://raw.githubusercontent.com/Wiojelt/test/{branch}/plugins.json?v=tcs-6-{digest[:12]}"]
          rp.write_text(json.dumps(repo,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          }

          update_catalog "$GITHUB_WORKSPACE" main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TurkishCineStream.cs3 plugins.json repo.json
          git -c commit.gpgsign=false commit --allow-empty-message -m ""
          git push origin HEAD:main

          git fetch origin builds
          git worktree add "$RUNNER_TEMP/test-builds" origin/builds
          update_catalog "$RUNNER_TEMP/test-builds" builds
          git -C "$RUNNER_TEMP/test-builds" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/test-builds" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/test-builds" add TurkishCineStream.cs3 plugins.json repo.json
          git -C "$RUNNER_TEMP/test-builds" -c commit.gpgsign=false commit --allow-empty-message -m ""
          git -C "$RUNNER_TEMP/test-builds" push origin HEAD:builds
