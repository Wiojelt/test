name: Import TurkishCineStream test artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-turkish-cinestream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-fda0-8210-b4c2-5de59ab29050/raw?se=2026-09-25T22%3A52%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=1d8e682d-623d-57ec-89ba-035da955a6e8&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A55%3A45Z&ske=2026-09-26T19%3A55%3A45Z&sks=b&skv=2026-02-06&sig=%2BsPF3n7q87Hp3VSJ64wKBT69jHAAcAPnKFW4UBSYXlA%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified TurkishCineStream package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tcs" "$RUNNER_TEMP/test-builds"
          mkdir -p "$RUNNER_TEMP/tcs"

          curl -fsSL "$ARTIFACT_URL" -o "$RUNNER_TEMP/tcs/artifact.zip"
          unzip -q -j "$RUNNER_TEMP/tcs/artifact.zip" TurkishCineStream.cs3 -d "$RUNNER_TEMP/tcs"

          python - "$RUNNER_TEMP/tcs/TurkishCineStream.cs3" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          p = Path(sys.argv[1])
          data = p.read_bytes()
          with zipfile.ZipFile(p) as z:
              manifest = json.loads(z.read("manifest.json"))
          if manifest.get("name") != "TurkishCineStream":
              raise SystemExit(f"Unexpected name: {manifest}")
          if manifest.get("version") != 1:
              raise SystemExit(f"Unexpected version: {manifest}")
          print("size", len(data))
          print("sha256", hashlib.sha256(data).hexdigest())
          PY

          git fetch origin builds
          git worktree add "$RUNNER_TEMP/test-builds" origin/builds
          cp "$RUNNER_TEMP/tcs/TurkishCineStream.cs3" "$RUNNER_TEMP/test-builds/TurkishCineStream.cs3"

          python - "$RUNNER_TEMP/test-builds" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          cs3 = root / "TurkishCineStream.cs3"
          data = cs3.read_bytes()
          digest = hashlib.sha256(data).hexdigest()

          plugins_path = root / "plugins.json"
          rows = json.loads(plugins_path.read_text(encoding="utf-8"))
          row = {
              "url": "https://raw.githubusercontent.com/Wiojelt/test/builds/TurkishCineStream.cs3",
              "status": 1,
              "version": 1,
              "name": "TurkishCineStream",
              "internalName": "TurkishCineStream",
              "authors": ["Wiojelt"],
              "description": "CineStream video motoru + Türkçe çoklu altyazı motoru (deneysel test sürümü)",
              "fileSize": len(data),
              "repositoryUrl": "https://github.com/Wiojelt/test",
              "language": "tr",
              "tvTypes": ["Movie", "TvSeries", "Anime", "AsianDrama"],
              "iconUrl": "https://raw.githubusercontent.com/Wiojelt/WioCinema/main/assets/logo.png",
              "apiVersion": 1,
              "fileHash": "sha256-" + digest
          }

          rows = [x for x in rows if x.get("internalName") != "TurkishCineStream"]
          rows.insert(0, row)
          plugins_path.write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          repo_path = root / "repo.json"
          repo = json.loads(repo_path.read_text(encoding="utf-8"))
          repo["pluginLists"] = [
              "https://raw.githubusercontent.com/Wiojelt/test/builds/plugins.json?v=tcs-1-" + digest[:12]
          ]
          repo_path.write_text(
              json.dumps(repo, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          git -C "$RUNNER_TEMP/test-builds" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/test-builds" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/test-builds" add TurkishCineStream.cs3 plugins.json repo.json
          git -C "$RUNNER_TEMP/test-builds" -c commit.gpgsign=false commit --allow-empty-message -m ""
          git -C "$RUNNER_TEMP/test-builds" push origin HEAD:builds
