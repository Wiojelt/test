name: Publish KoolTV registry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-kooltv-registry.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register existing KoolTV artifact
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          path="KoolTV.cs3"
          with open(path,"rb") as f: digest=hashlib.sha256(f.read()).hexdigest()
          with open("plugins.json",encoding="utf-8") as f: data=json.load(f)
          entry={"url":"https://raw.githubusercontent.com/Wiojelt/test/main/KoolTV.cs3","status":1,"version":1,"name":"Kool TV","internalName":"KoolTV","authors":["Wiojelt"],"description":"Kool TV · ülke/bölge seçimi, tüm kanallar, kategori rafları ve oynatma anında canlı bağlantı çözümleme.","fileSize":os.path.getsize(path),"repositoryUrl":"https://github.com/Wiojelt/test","language":"tr","tvTypes":["Live"],"iconUrl":"https://raw.githubusercontent.com/Wiojelt/test/main/assets/wiotest.png","apiVersion":1,"fileHash":"sha256-"+digest}
          data=[x for x in data if x.get("internalName")!="KoolTV"]+[entry]
          with open("plugins.json","w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2);f.write("\n")
          print(entry)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add plugins.json
          git commit -m "Register KoolTV in test repository"
          git pull --rebase origin main
          git push
